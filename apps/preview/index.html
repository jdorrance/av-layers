<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="build-deployment" content="%VITE_BUILD_REVISION%" />
    <title>Aviation Forecast Layers preview</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <header id="topbar">
        <div id="models" role="toolbar" aria-label="Forecast model"></div>
        <div id="reference" role="group" aria-label="Lift reference">
          <button id="ref-agl" type="button" class="ref">AGL</button>
          <button id="ref-msl" type="button" class="ref">MSL</button>
        </div>
        <label id="opacity-label">
          Opacity
          <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.7" />
          <span id="opacity-readout">70%</span>
        </label>
      </header>
      <aside id="legend" class="ribbon" hidden>
        <div id="legend-body"></div>
        <button id="legend-toggle" type="button" aria-expanded="true" aria-label="Collapse lift scale">⌃</button>
      </aside>
      <footer id="timebar">
        <div id="days" role="toolbar" aria-label="Forecast day"></div>
        <input id="time" type="range" min="0" max="0" step="1" value="0" aria-label="Forecast time" />
        <p id="timestamp">No frame selected</p>
      </footer>
      <p id="horizon-notice" class="toast" role="status" hidden></p>
      <p id="tile-error" class="toast error" role="alert" hidden></p>
      <p id="error" class="toast error" role="alert" hidden></p>
      <p id="freshness" class="sr-only">Loading latest immutable build…</p>
      <div id="point-card" hidden>
        <p id="point-summary"></p>
        <p id="point-status"></p>
        <label class="point-units">Units <select id="point-units"><option value="metric">m · m/s</option><option value="imperial">ft · kt</option></select></label>
        <div id="point-body" tabindex="-1"></div>
        <details><summary>Build details</summary><dl id="meta"></dl></details>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
