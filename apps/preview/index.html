<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aviation Forecast Layers preview</title>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <header>
          <h1>Aviation Forecast Layers</h1>
          <p id="freshness" class="muted">Loading latest immutable build…</p>
        </header>
        <div class="controls">
          <label>Model <select id="model"></select></label>
          <label>Layer <select id="layer"></select></label>
          <label>Frame <select id="frame"></select></label>
          <label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.5" /></label>
        </div>
        <p id="timestamp" class="badge">No frame selected</p>
        <p id="error" class="error" hidden></p>
        <p id="coverage-note" class="muted"></p>
        <div id="legend"></div>
        <section id="series-panel">
          <h2>Point series</h2>
          <p class="muted">Click the map, then request all 8 frames × 3 layers.</p>
          <button id="series-button" type="button" disabled>Sample clicked point (8 × 3)</button>
          <p id="series-status" class="muted"></p>
          <div id="series"></div>
        </section>
        <details class="diagnostics">
          <summary>Build &amp; method diagnostics</summary>
          <dl id="meta"></dl>
        </details>
      </aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
