name: Set up workspace
description: Install the package-defined Node and pnpm versions and locked dependencies
inputs:
  eccodes:
    description: Install the pinned ICON decoder
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: package.json
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: astral-sh/setup-uv@v6
      if: inputs.eccodes == 'true'
      with:
        version: '0.8.17'
    - run: pnpm tools:eccodes
      if: inputs.eccodes == 'true'
      shell: bash
