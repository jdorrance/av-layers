name: Forecast
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      model:
        description: Forecast model
        type: string
        default: gfs
        required: true
      cycle:
        description: Optional upstream cycle (ISO 8601 UTC); empty discovers the latest admissible run
        type: string
        default: ''
      allow-same-cycle:
        description: Intentionally replace the current cycle with a fresh validated build
        type: boolean
        default: false
      resume-run-id:
        description: Finished run with complete artifacts to resume or promote within six hours
        type: string
        default: ''
      retain-full-artifacts:
        description: Upload full binary tile/sample build output to GitHub Actions artifacts even when R2 publication succeeds
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: forecast-${{ inputs.environment || 'production' }}-${{ inputs.model || 'gfs' }}
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'production' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment || 'production' }}
      MODEL: ${{ inputs.model || 'gfs' }}
      CYCLE: ${{ inputs.cycle || '' }}
      ALLOW_SAME_CYCLE: ${{ inputs['allow-same-cycle'] || false }}
      RESUME_RUN_ID: ${{ inputs['resume-run-id'] || '' }}
      RETAIN_FULL_ARTIFACTS: ${{ inputs['retain-full-artifacts'] || false }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run forecast
        run: pnpm operations forecast
      - name: Upload build records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-receipts-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/builds/*/*/manifest.json
            output/builds/*/*/provenance.json
            output/builds/*/*/performance.json
            output/builds/*/*/publication.json
            output/builds/*/*/maintenance.json
            output/failure.json
            output/builds/*/*/progress.json
            output/builds/*/*/failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload full build artifacts on failure or explicit request
        uses: actions/upload-artifact@v4
        if: ${{ failure() || cancelled() || env.RETAIN_FULL_ARTIFACTS == 'true' }}
        with:
          name: forecast-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/builds/
            output/coverage/
          if-no-files-found: warn
          retention-days: 7
