name: Forecast
run-name: Forecast ${{ github.event_name == 'repository_dispatch' && 'external cycle' || format('{0} {1}', inputs.environment || 'production', inputs.model || 'all') }}
on:
  schedule:
    - cron: 35 4,10,16,22 * * *
    - cron: 20 5,11,17,23 * * *
    - cron: 45 3,9,15,21 * * *
  repository_dispatch:
    types: [upstream-cycle-ready]
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options: [staging, production]
        default: production
        required: true
      model:
        description: Forecast model
        type: string
        default: all
        required: true
      cycle:
        description: Optional upstream UTC cycle; empty discovers each model's latest run
        type: string
        default: ''
      allow-same-cycle:
        description: Intentionally replace the current cycle with a fresh validated build
        type: boolean
        default: false
      resume-run-id:
        description: Finished authorized run with a resumable receipt bundle for every selected model
        type: string
        default: ''
      retain-full-artifacts:
        description: Retain full forecast payloads in addition to the receipt bundle
        type: boolean
        default: false
      wind-data:
        description: Generate numeric wind map data
        type: boolean
        default: true
      terrain-catalog-ref:
        description: Override the terrain catalog JSON; defaults to TERRAIN_CATALOG_REF or the production pin
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.models.outputs.matrix }}
      model-parallelism: ${{ steps.models.outputs.model-parallelism }}
      environment: ${{ steps.dispatch.outputs.environment || inputs.environment || 'production' }}
      cycle: ${{ steps.dispatch.outputs.cycle || inputs.cycle || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Admit external cycle
        id: dispatch
        if: github.event_name == 'repository_dispatch'
        run: node --import tsx scripts/forecast-dispatch.ts
      - name: Select forecast models
        id: models
        env:
          MODEL_SELECTION: ${{ steps.dispatch.outputs.model || inputs.model || 'all' }}
          MODEL_SCHEDULE: ${{ github.event.schedule || '' }}
        run: node --import tsx scripts/workflow-models.ts --forecast
  forecast:
    name: Forecast ${{ matrix.model }}
    needs: select
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.select.outputs.model-parallelism) }}
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    concurrency:
      group: forecast-${{ needs.select.outputs.environment }}-${{ matrix.model }}
      cancel-in-progress: false
    uses: ./.github/workflows/forecast-model.yml
    with:
      environment: ${{ needs.select.outputs.environment }}
      model: ${{ matrix.model }}
      parallelism: ${{ matrix.parallelism }}
      cycle: ${{ needs.select.outputs.cycle }}
      allow-same-cycle: ${{ inputs['allow-same-cycle'] || false }}
      resume-run-id: ${{ inputs['resume-run-id'] || '' }}
      retain-full-artifacts: ${{ inputs['retain-full-artifacts'] || false }}
      wind-data: ${{ github.event_name != 'workflow_dispatch' || inputs['wind-data'] }}
      terrain-catalog-ref: ${{ inputs['terrain-catalog-ref'] || '' }}
    secrets: inherit
