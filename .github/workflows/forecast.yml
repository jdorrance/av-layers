name: Forecast
run-name: Forecast ${{ inputs.environment || 'production' }} ${{ inputs.model || 'all' }}
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options: [staging, production]
        default: production
        required: true
      model:
        description: Forecast model
        type: choice
        options: [all, gfs, icon-eu]
        default: all
        required: true
      cycle:
        description: Optional upstream UTC cycle; empty discovers each model's latest run
        type: string
        default: ''
      allow-same-cycle:
        description: Intentionally replace the current cycle with a fresh validated build
        type: boolean
        default: false
      resume-run-id:
        description: Finished authorized run with a resumable receipt bundle for every selected model
        type: string
        default: ''
      retain-full-artifacts:
        description: Retain full forecast payloads in addition to the receipt bundle
        type: boolean
        default: false
      terrain-inputs:
        description: Optional JSON object mapping model IDs to prepared terrain references
        type: string
        default: ''
      terrain-catalog-ref:
        description: Override the terrain catalog JSON; defaults to TERRAIN_CATALOG_REF or the production pin
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select forecast models
        id: models
        env:
          MODEL_SELECTION: ${{ inputs.model || 'all' }}
        run: node --import tsx scripts/workflow-models.ts
  forecast:
    name: Forecast ${{ matrix.model }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.select.outputs.models) }}
    concurrency:
      group: forecast-${{ inputs.environment || 'production' }}-${{ matrix.model }}
      cancel-in-progress: false
    uses: ./.github/workflows/forecast-model.yml
    with:
      environment: ${{ inputs.environment || 'production' }}
      model: ${{ matrix.model }}
      cycle: ${{ inputs.cycle || '' }}
      allow-same-cycle: ${{ inputs['allow-same-cycle'] || false }}
      resume-run-id: ${{ inputs['resume-run-id'] || '' }}
      retain-full-artifacts: ${{ inputs['retain-full-artifacts'] || false }}
      terrain-inputs: ${{ inputs['terrain-inputs'] || '' }}
      terrain-catalog-ref: ${{ inputs['terrain-catalog-ref'] || '' }}
    secrets: inherit
