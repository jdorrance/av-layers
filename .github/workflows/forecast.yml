name: Forecast sample
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      model:
        description: Forecast model
        type: choice
        options:
          - gfs
        default: gfs
        required: true
      cycle:
        description: Optional upstream cycle (ISO 8601 UTC); empty discovers the latest admissible run
        type: string
        default: ''
      allow-same-cycle:
        description: Intentionally replace the current cycle with a fresh validated build
        type: boolean
        default: false
      resume-run-id:
        description: Optional failed run ID whose complete artifact should be resumed within six hours
        type: string
        default: ''
      retain-full-artifacts:
        description: Upload full binary tile/sample build output to GitHub Actions artifacts even when R2 publication succeeds
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: forecast-${{ inputs.environment || 'production' }}-gfs
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'production' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'production' }}
      MODEL: ${{ inputs.model || 'gfs' }}
      CYCLE: ${{ inputs.cycle || '' }}
      ALLOW_SAME_CYCLE: ${{ inputs['allow-same-cycle'] || false }}
      RESUME_RUN_ID: ${{ inputs['resume-run-id'] || '' }}
      RETAIN_FULL_ARTIFACTS: ${{ inputs['retain-full-artifacts'] || false }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse superseded main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current}" != "${GITHUB_SHA}" ]; then
            echo 'This revision has been superseded on main; run the latest revision instead.' >&2
            exit 1
          fi
      - name: Validate forecast environment and secrets
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET_ENV}" in
            staging|production) ;;
            *) echo 'unsupported forecast environment' >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo 'forecast runs only from main' >&2
            exit 1
          fi
          if [ "${MODEL}" != 'gfs' ]; then
            echo 'unsupported model' >&2
            exit 1
          fi
          if [ -n "${RESUME_RUN_ID:-}" ] && ! [[ "${RESUME_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo 'resume-run-id must be numeric' >&2
            exit 1
          fi
          for name in CLOUDFLARE_ACCOUNT_ID R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "missing required forecast value ${name}" >&2
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate publication environment mapping
        run: pnpm exec tsx scripts/cloudflare-ci.ts publicationcheck --env "${TARGET_ENV}"
      - run: pnpm tools:pmtiles
      - name: Verify source artifact workflow
        if: env.RESUME_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ env.RESUME_RUN_ID }}
        run: pnpm exec tsx scripts/check-forecast-artifact.ts
      - name: Download complete failed-run artifact
        if: env.RESUME_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: forecast-gfs-${{ env.RESUME_RUN_ID }}
          path: output
          run-id: ${{ env.RESUME_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Resume verified publication
        if: env.RESUME_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/resume-publication.ts
      - name: Build, validate and publish
        if: env.RESUME_RUN_ID == ''
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/build-and-publish.ts
      - name: Upload build receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-receipts-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/builds/*/*/manifest.json
            output/builds/*/*/provenance.json
            output/builds/*/*/performance.json
            output/builds/*/*/publication.json
            output/builds/*/*/maintenance.json
            output/failure.json
            output/builds/*/*/progress.json
            output/builds/*/*/failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload full build artifacts on failure or explicit request
        uses: actions/upload-artifact@v4
        if: ${{ failure() || cancelled() || env.RETAIN_FULL_ARTIFACTS == 'true' }}
        with:
          name: forecast-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/builds/
            output/coverage/
          if-no-files-found: warn
          retention-days: 7
