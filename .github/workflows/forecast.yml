name: Forecast sample
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      model:
        description: Forecast model
        type: choice
        options:
          - gfs
        default: gfs
        required: true
      cycle:
        description: Optional upstream cycle (ISO 8601 UTC); empty discovers the latest admissible run
        type: string
        default: ''
      retain-full-artifacts:
        description: Upload full binary tile/sample build output to GitHub Actions artifacts even when R2 publication succeeds
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: forecast-${{ inputs.environment || 'production' }}-gfs
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: ${{ inputs.environment || 'production' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'production' }}
      MODEL: ${{ inputs.model || 'gfs' }}
      CYCLE: ${{ inputs.cycle || '' }}
      RETAIN_FULL_ARTIFACTS: ${{ inputs['retain-full-artifacts'] || false }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse superseded main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current}" != "${GITHUB_SHA}" ]; then
            echo 'This revision has been superseded on main; run the latest revision instead.' >&2
            exit 1
          fi
      - name: Validate forecast environment and secrets
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET_ENV}" in
            staging|production) ;;
            *) echo 'unsupported forecast environment' >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo 'forecast runs only from main' >&2
            exit 1
          fi
          if [ "${MODEL}" != 'gfs' ]; then
            echo 'unsupported model' >&2
            exit 1
          fi
          for name in CLOUDFLARE_ACCOUNT_ID R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "missing required forecast value ${name}" >&2
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate publication environment mapping
        run: pnpm exec tsx scripts/cloudflare-ci.ts publicationcheck --env "${TARGET_ENV}"
      - run: pnpm tools:pmtiles
      - name: Build sample
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CYCLE}" ]; then
            pnpm run build:sample --model "${MODEL}" --out output --cache-dir .cache/gfs --cycle "${CYCLE}"
          else
            pnpm run build:sample --model "${MODEL}" --out output --cache-dir .cache/gfs
          fi
          manifest="$(find "output/builds/${MODEL}" -mindepth 2 -maxdepth 2 -name manifest.json -print | sort | tail -1)"
          test -n "${manifest}"
          printf 'MANIFEST=%s\n' "${manifest}" >> "${GITHUB_ENV}"
      - name: Refuse superseded main revision before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current}" != "${GITHUB_SHA}" ]; then
            echo 'This revision was superseded during the build; rerun the latest revision before publishing.' >&2
            exit 1
          fi
      - name: Publish immutable build and pointer
        id: publish
        run: pnpm run publish --manifest "${MANIFEST}"
      - name: Upload build receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-receipts-${{ env.MODEL }}-${{ github.run_id }}
          path: |
            output/builds/*/*/manifest.json
            output/builds/*/*/provenance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload full build artifacts on failure or explicit request
        uses: actions/upload-artifact@v4
        if: ${{ failure() || env.RETAIN_FULL_ARTIFACTS == 'true' }}
        with:
          name: forecast-${{ env.MODEL }}-${{ github.run_id }}
          path: output/builds/
          if-no-files-found: warn
          retention-days: 7
