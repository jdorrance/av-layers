name: Launch sunlight terrain
run-name: Sunlight ${{ inputs.site }} — ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terrain storage environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
      site:
        description: Launch slug in Windgrams forecasts/sites.json
        type: string
        default: am-hatis-500
        required: true
      terrain-catalog-ref:
        description: Catalog reference JSON; defaults to the environment TERRAIN_CATALOG_REF
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: solar-terrain-${{ inputs.environment }}-${{ inputs.site }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      SITE: ${{ inputs.site }}
      TERRAIN_CATALOG_REF: ${{ inputs['terrain-catalog-ref'] || vars.TERRAIN_CATALOG_REF }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/checkout@v4
        with:
          repository: jdorrance/windgrams
          ref: main
          path: windgrams-sites
          sparse-checkout: forecasts/sites.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Publish verified launch terrain
        run: |
          mkdir -p output
          printf '%s' "${TERRAIN_CATALOG_REF:?Select a terrain-catalog-ref input or set TERRAIN_CATALOG_REF}" > output/terrain-catalog-ref.json
          pnpm terrain solar --catalog-ref output/terrain-catalog-ref.json --sites windgrams-sites/forecasts/sites.json --site "$SITE" --out output/solar-terrain.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-terrain-${{ github.run_id }}
          path: output/solar-terrain.json
          if-no-files-found: warn
          retention-days: 90
