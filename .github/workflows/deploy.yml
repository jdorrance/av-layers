name: Deploy Worker and Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      confirm:
        description: Type deploy-read-only-worker to acknowledge no write routes or public bucket bypass
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'production' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment || 'production' }}
      CONFIRM: ${{ inputs.confirm || '' }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run deploy
        run: pnpm operations deploy
