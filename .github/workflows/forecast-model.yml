name: Forecast model
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      model:
        type: string
        required: true
      cycle:
        type: string
        default: ''
      allow-same-cycle:
        type: boolean
        default: false
      resume-run-id:
        type: string
        default: ''
      retain-full-artifacts:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  TARGET_ENV: ${{ inputs.environment }}
  MODEL: ${{ inputs.model }}
  CYCLE: ${{ inputs.cycle || '' }}
  ALLOW_SAME_CYCLE: ${{ inputs['allow-same-cycle'] || false }}
  RESUME_RUN_ID: ${{ inputs['resume-run-id'] || '' }}
  RETAIN_FULL_ARTIFACTS: ${{ inputs['retain-full-artifacts'] || false }}
jobs:
  prepare:
    name: Plan ${{ inputs.model }}
    if: ${{ github.ref == 'refs/heads/main' && !inputs['resume-run-id'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      shards: ${{ steps.plan.outputs.shards }}
      artifact: ${{ steps.plan.outputs.artifact }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Admit cycle and plan forecast
        id: plan
        run: pnpm operations forecast-plan
      - name: Share immutable build plan
        uses: actions/upload-artifact@v4
        if: steps.plan.outputs.ready == 'true'
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: |
            output/plan.json
            output/coverage/
          if-no-files-found: error
          retention-days: 1
      - name: Upload planning failure
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: forecast-plan-failure-${{ env.MODEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/failure.json
          if-no-files-found: warn
          retention-days: 7
  shard:
    name: "Build ${{ inputs.model }}: ${{ matrix.shard.hours }}"
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      SHARD_ID: ${{ matrix.shard.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: output
      - name: Build forecast shard
        run: pnpm operations forecast-shard
      - name: Upload completed shard
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}-shard-${{ matrix.shard.id }}
          overwrite: true
          path: |
            output/builds/
            output/shards/
          if-no-files-found: error
          retention-days: 1
      - name: Upload shard diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-shard-records-${{ env.MODEL }}-${{ github.run_id }}-${{ matrix.shard.id }}
          overwrite: true
          path: |
            output/shards/*/*.json
            output/failure.json
          if-no-files-found: warn
          retention-days: 7
  build-publish:
    name: Publish ${{ inputs.model }}
    needs: [prepare, shard]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && (inputs['resume-run-id'] || (needs.prepare.outputs.ready == 'true' && needs.shard.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download build plan
        uses: actions/download-artifact@v4
        if: ${{ !inputs['resume-run-id'] }}
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: output
      - name: Download forecast shards
        uses: actions/download-artifact@v4
        if: ${{ !inputs['resume-run-id'] }}
        with:
          pattern: ${{ needs.prepare.outputs.artifact }}-shard-*
          merge-multiple: true
          path: output
      - name: Publish forecast
        run: pnpm operations forecast
      - name: Upload build records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-receipts-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/builds/*/*/manifest.json
            output/builds/*/*/provenance.json
            output/builds/*/*/performance.json
            output/builds/*/*/publication.json
            output/builds/*/*/maintenance.json
            output/builds/*/*/serving.json
            output/failure.json
            output/builds/*/*/progress.json
            output/builds/*/*/failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload full build artifacts on failure or explicit request
        uses: actions/upload-artifact@v4
        if: ${{ failure() || cancelled() || env.RETAIN_FULL_ARTIFACTS == 'true' }}
        with:
          name: forecast-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/builds/
            output/coverage/
          if-no-files-found: warn
          retention-days: 7
