name: Forecast model
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      model:
        type: string
        required: true
      parallelism:
        type: number
        required: true
      cycle:
        type: string
        default: ''
      allow-same-cycle:
        type: boolean
        default: false
      resume-run-id:
        type: string
        default: ''
      retain-full-artifacts:
        type: boolean
        default: false
      terrain-catalog-ref:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  TARGET_ENV: ${{ inputs.environment }}
  MODEL: ${{ inputs.model }}
  CYCLE: ${{ inputs.cycle || '' }}
  ALLOW_SAME_CYCLE: ${{ inputs['allow-same-cycle'] || false }}
  RESUME_RUN_ID: ${{ inputs['resume-run-id'] || '' }}
  RETAIN_FULL_ARTIFACTS: ${{ inputs['retain-full-artifacts'] || false }}
jobs:
  terrain:
    name: Terrain ${{ inputs.model }}
    if: ${{ github.ref == 'refs/heads/main' && !inputs['resume-run-id'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    environment: ${{ inputs.environment }}
    env: &plan-env
      TERRAIN_CATALOG_REF: >-
        ${{ inputs['terrain-catalog-ref'] || vars.TERRAIN_CATALOG_REF ||
        (inputs.environment == 'production' && '{"key":"terrain/catalogs/ea3deca482167f825fd6e05d24c120d56c7c0511d2dd52b13f220e77f011137a.json","sha256":"ea3deca482167f825fd6e05d24c120d56c7c0511d2dd52b13f220e77f011137a","bytes":12531165}') || '' }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare reusable terrain in R2
        run: pnpm operations forecast-terrain
      - name: Upload terrain preparation failure
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: forecast-terrain-failure-${{ env.MODEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/failure.json
          if-no-files-found: warn
          retention-days: 7
  prepare:
    name: Plan ${{ inputs.model }}
    needs: terrain
    if: ${{ github.ref == 'refs/heads/main' && !inputs['resume-run-id'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      shards: ${{ steps.plan.outputs.shards }}
      artifact: ${{ steps.plan.outputs.artifact }}
      credential-secret: ${{ steps.plan.outputs.credential-secret }}
    env: *plan-env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Admit cycle and plan forecast from cached terrain
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_CREDENTIAL_ISSUER_TOKEN: ${{ secrets.GH_CREDENTIAL_ISSUER_TOKEN }}
        run: pnpm operations forecast-plan
      - name: Share immutable build plan
        uses: actions/upload-artifact@v4
        if: steps.plan.outputs.ready == 'true'
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: |
            output/plan.json
            output/shard-credentials.json
            output/plan-metrics.json
            output/coverage/
            output/terrain/prepared/*/manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload planning failure
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: forecast-plan-failure-${{ env.MODEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/failure.json
            output/coverage/
            output/terrain/
          if-no-files-found: warn
          retention-days: 7
  shard:
    name: "Build ${{ inputs.model }}: ${{ matrix.shard.hours }}"
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallelism }}
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      SHARD_ID: ${{ matrix.shard.id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: output
      - name: Build forecast shard
        env:
          FORECAST_SHARD_CREDENTIAL_KEY: ${{ secrets[needs.prepare.outputs.credential-secret] }}
        run: pnpm operations forecast-shard
      - name: Upload completed shard
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}-shard-${{ matrix.shard.id }}
          overwrite: true
          path: |
            output/shards/
          if-no-files-found: error
          retention-days: 1
      - name: Upload full shard payload on request
        uses: actions/upload-artifact@v4
        if: ${{ inputs['retain-full-artifacts'] }}
        with:
          name: ${{ needs.prepare.outputs.artifact }}-payload-${{ matrix.shard.id }}
          path: output/builds/
          if-no-files-found: error
          retention-days: 1
      - name: Upload shard diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-shard-records-${{ env.MODEL }}-${{ github.run_id }}-${{ matrix.shard.id }}
          overwrite: true
          path: |
            output/shards/*/*.json
            output/failure.json
          if-no-files-found: warn
          retention-days: 7
  build-publish:
    name: Publish ${{ inputs.model }}
    needs: [prepare, shard]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && (inputs['resume-run-id'] || (needs.prepare.outputs.ready == 'true' && needs.shard.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start artifact download timing
        id: downloads
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'started=' + Date.now() + '\n')"
      - name: Download build plan
        uses: actions/download-artifact@v4
        if: ${{ !inputs['resume-run-id'] }}
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: output
      - name: Download forecast shards
        uses: actions/download-artifact@v4
        if: ${{ !inputs['resume-run-id'] }}
        with:
          pattern: ${{ needs.prepare.outputs.artifact }}-shard-*
          merge-multiple: true
          path: output/shards
      - name: Publish forecast
        env:
          FORECAST_ARTIFACT_DOWNLOAD_STARTED_AT: ${{ steps.downloads.outputs.started }}
        run: pnpm operations forecast
      - name: Download retained shard payloads
        uses: actions/download-artifact@v4
        if: ${{ always() && !inputs['resume-run-id'] && inputs['retain-full-artifacts'] && needs.shard.result == 'success' }}
        with:
          pattern: ${{ needs.prepare.outputs.artifact }}-payload-*
          merge-multiple: true
          path: output/builds
      - name: Upload build records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-receipts-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/builds/*/*/manifest.json
            output/builds/*/*/provenance.json
            output/builds/*/*/performance.json
            output/builds/*/*/publication.json
            output/builds/*/*/maintenance.json
            output/builds/*/*/serving.json
            output/failure.json
            output/builds/*/*/progress.json
            output/builds/*/*/failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload resumable build records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-${{ env.MODEL }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/plan.json
            output/plan-metrics.json
            output/workflow.json
            output/shards/*/*.json
            output/builds/*/*/*.json
            output/coverage/
            output/terrain/prepared/*/manifest.json
            output/failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload full build artifacts on request
        uses: actions/upload-artifact@v4
        if: ${{ always() && env.RETAIN_FULL_ARTIFACTS == 'true' }}
        with:
          name: forecast-full-${{ env.MODEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/plan.json
            output/builds/
            output/coverage/
            output/terrain/
            output/shards/
          if-no-files-found: warn
          retention-days: 7
