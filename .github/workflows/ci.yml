name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm tools:pmtiles
      - name: Verify foundation
        run: pnpm verify
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
      - name: Verify lossless terrain packing
        run: uv run --python 3.12 --with rasterio==1.4.3 --with numpy==2.2.6 python apps/batch/src/terrain/test_repack.py
