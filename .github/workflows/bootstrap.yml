name: Bootstrap Cloudflare resources
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      confirm:
        description: Type bootstrap-private-cloudflare to acknowledge private bucket and Pages creation
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment }}
      CONFIRM: ${{ inputs.confirm }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run bootstrap
        run: pnpm operations bootstrap
