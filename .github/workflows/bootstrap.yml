name: Bootstrap Cloudflare resources
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      confirm:
        description: Type bootstrap-private-cloudflare to acknowledge private bucket and Pages creation
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      CONFIRM: ${{ inputs.confirm }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse superseded main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current}" != "${GITHUB_SHA}" ]; then
            echo 'This revision has been superseded on main; run the latest revision instead.' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate bootstrap inputs and credentials
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET_ENV}" in
            staging|production) ;;
            *) echo 'unsupported bootstrap environment' >&2; exit 1 ;;
          esac
          if [ "${CONFIRM}" != 'bootstrap-private-cloudflare' ]; then
            echo 'confirm must equal bootstrap-private-cloudflare' >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo 'bootstrap runs only from main' >&2
            exit 1
          fi
          pnpm exec tsx scripts/cloudflare-ci.ts envcheck --env "${TARGET_ENV}"
      - name: Provision private R2 bucket and Pages project
        run: pnpm exec tsx scripts/cloudflare-ci.ts provision --env "${TARGET_ENV}"
