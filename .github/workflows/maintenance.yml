name: Forecast maintenance
run-name: Maintenance ${{ inputs.environment || 'production' }} ${{ inputs.model }} ${{ inputs.action }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      action:
        description: Serialized publication maintenance action
        type: choice
        options:
          - rollback
          - cleanup
        required: true
      model:
        description: Model pointer to maintain
        type: string
        required: true
      build-id:
        description: Retained build ID for rollback
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: forecast-${{ inputs.environment || 'production' }}-${{ inputs.model }}
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'production' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment || 'production' }}
      ACTION: ${{ inputs.action }}
      MODEL: ${{ inputs.model }}
      BUILD_ID: ${{ inputs['build-id'] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run maintenance
        run: pnpm operations maintenance
      - name: Upload maintenance outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-${{ inputs.action }}-${{ github.run_id }}
          overwrite: true
          path: output/maintenance.json
          if-no-files-found: warn
          retention-days: 14
