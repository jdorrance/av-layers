name: Forecast maintenance
run-name: Maintenance ${{ inputs.environment || 'production' }} ${{ inputs.action }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Cloudflare environment
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      action:
        description: Serialized publication maintenance action
        type: choice
        options:
          - rollback
          - cleanup
        required: true
      model:
        description: Model pointer to maintain
        type: choice
        options:
          - gfs
        default: gfs
        required: true
      build-id:
        description: Retained build ID for rollback
        type: string
        default: ''
      confirm:
        description: Type serialized-maintenance to acknowledge this action runs under the forecast writer lock
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: forecast-${{ inputs.environment || 'production' }}-gfs
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'production' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment || 'production' }}
      ACTION: ${{ inputs.action }}
      MODEL: ${{ inputs.model }}
      BUILD_ID: ${{ inputs['build-id'] }}
      CONFIRM: ${{ inputs.confirm }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run maintenance
        run: pnpm operations maintenance
      - name: Upload maintenance outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-${{ inputs.action }}-${{ github.run_id }}
          overwrite: true
          path: output/maintenance.json
          if-no-files-found: warn
          retention-days: 14
